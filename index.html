<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test.github.io</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      line-height: 1.6;
    }
    header {
      margin-bottom: 2rem;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 0.75rem;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #1f2937;
    }
    p {
      margin: 0.75rem 0;
    }
    a {
      color: #2563eb;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
    }
    code {
      background: #f3f4f6;
      padding: 0.2rem 0.4rem;
      border-radius: 0.375rem;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hello, GitHub Pages</h1>
  </header>
  <main>
    <p>项目名：<strong>test.github.io</strong></p>
    <p>当前分支：<code>{{ BRANCH_NAME }}</code></p>
    <p>最近构建时间：<code>{{ BUILD_TIME }}</code></p>
    <p><a href="README.md">查看 README 指南</a></p>
  </main>
  <footer>
    <p>此页面托管在 GitHub Pages 上</p>
  </footer>
  <!-- build:time -->
</body>
</html>
